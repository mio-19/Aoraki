<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="bird" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Outer luminous ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.85" filter="url(#glow)"/>

  <!-- Kiwix Stylized Reader Icon: Open Book with Radiant Wiki Beacon -->
  <!-- Book base left page -->
  <path d="M 64 86 C 54 82 40 80 26 83 L 26 47 C 40 44 54 46 64 50 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Book base right page -->
  <path d="M 64 86 C 74 82 88 80 102 83 L 102 47 C 88 44 74 46 64 50 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

  <!-- Spine / Binding -->
  <line x1="64" y1="48" x2="64" y2="87" stroke="#00e5ff" stroke-width="2.5"/>

  <!-- Dynamic Reading Wings / Kiwix Beacon radiating from center -->
  <path d="M 64 42 C 58 32 46 26 36 29 C 48 31 56 37 64 44 Z" fill="url(#bird)" opacity="0.9"/>
  <path d="M 64 42 C 70 32 82 26 92 29 C 80 31 72 37 64 44 Z" fill="url(#bird)" opacity="0.9"/>

  <!-- Knowledge spark in center -->
  <circle cx="64" cy="38" r="4" fill="#00e5ff" filter="url(#glow)"/>
</svg>

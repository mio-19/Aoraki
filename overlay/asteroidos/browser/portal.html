<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch Browser</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121824;
      --accent-color: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.35);
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px 40px 16px;
    }

    /* Circular display safe-area header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
      margin-bottom: 12px;
      text-align: center;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-color);
      margin-bottom: 2px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Search input bar */
    .search-box {
      width: 85%;
      max-width: 320px;
      margin-bottom: 14px;
    }

    .search-form {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      overflow: hidden;
      padding: 2px 4px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13px;
      padding: 8px 12px;
    }

    .search-btn {
      background: var(--accent-color);
      border: none;
      border-radius: 20px;
      color: #000;
      font-size: 12px;
      font-weight: bold;
      padding: 0 12px;
      cursor: pointer;
    }

    /* Speed dial bookmark tiles */
    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 82%;
      max-width: 300px;
      margin-bottom: 16px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 8px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.1s ease, border-color 0.1s ease;
    }

    .tile:active {
      transform: scale(0.95);
      border-color: var(--accent-color);
      background: #1a2332;
    }

    .tile-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .tile-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Quick controls at bottom */
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
      width: 75%;
    }

    .ctrl-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    .ctrl-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .footer {
      font-size: 9px;
      color: #556980;
      margin-top: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">NixOS Watch</div>
    <div class="title">Web Navigator</div>
  </div>

  <div class="search-box">
    <form class="search-form" action="https://html.duckduckgo.com/html/" method="get" onsubmit="return handleNavigate(event);">
      <input id="url-input" class="search-input" type="search" name="q" placeholder="Search or URL..." autocomplete="off">
      <button class="search-btn" type="submit">&#8594;</button>
    </form>
  </div>

  <div class="tiles-grid">
    <a class="tile" href="https://en.m.wikipedia.org">
      <div class="tile-icon">&#128218;</div>
      <div class="tile-label">Wikipedia</div>
    </a>
    <a class="tile" href="https://html.duckduckgo.com">
      <div class="tile-icon">&#128269;</div>
      <div class="tile-label">DuckDuckGo</div>
    </a>
    <a class="tile" href="https://asteroidos.org/wiki/">
      <div class="tile-icon">&#128392;</div>
      <div class="tile-label">AsteroidOS</div>
    </a>
    <a class="tile" href="https://news.ycombinator.com">
      <div class="tile-icon">&#128187;</div>
      <div class="tile-label">Hacker News</div>
    </a>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="history.back()" title="Back">&#9664;</button>
    <button class="ctrl-btn" onclick="location.reload()" title="Reload">&#8635;</button>
    <button class="ctrl-btn" onclick="history.forward()" title="Forward">&#9654;</button>
  </div>

  <div class="footer">Optimized for 400x400 Circular Display</div>

  <script>
    function handleNavigate(event) {
      var input = document.getElementById('url-input').value.trim();
      if (!input) return false;
      if (/^https?:\/\//i.test(input)) {
        window.location.href = input;
        return false;
      } else if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/i.test(input)) {
        window.location.href = 'https://' + input;
        return false;
      }
      return true;
    }
  </script>
</body>
</html>

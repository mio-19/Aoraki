<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36"/>
      <stop offset="50%" stop-color="#102a4c"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>
    <linearGradient id="compass-north" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
    <linearGradient id="compass-south" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Outer orbital ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#orbit)" stroke-width="3" stroke-dasharray="14 6" opacity="0.8" filter="url(#glow)"/>

  <!-- Latitude / Longitude globe lines -->
  <ellipse cx="64" cy="64" rx="42" ry="42" fill="none" stroke="#2a527a" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="64" cy="64" rx="20" ry="42" fill="none" stroke="#2a527a" stroke-width="1.5" opacity="0.6"/>
  <line x1="22" y1="64" x2="106" y2="64" stroke="#2a527a" stroke-width="1.5" opacity="0.6"/>
  <line x1="64" y1="22" x2="64" y2="106" stroke="#2a527a" stroke-width="1.5" opacity="0.6"/>

  <!-- Stylized Compass / Navigator Pointer (35 degree tilt) -->
  <g transform="translate(64,64) rotate(35)">
    <!-- North Needle -->
    <polygon points="0,-36 9,0 0,-4" fill="url(#compass-north)" filter="url(#glow)"/>
    <polygon points="0,-36 -9,0 0,-4" fill="#b71c1c"/>
    <!-- South Needle -->
    <polygon points="0,36 9,0 0,4" fill="url(#compass-south)"/>
    <polygon points="0,36 -9,0 0,4" fill="#90a4ae"/>
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="5" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#00e5ff"/>
  </g>
</svg>
